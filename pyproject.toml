[project]
name = "ha-ke2"
version = "0.1.0"
description = "Home Assistant integration for KE2 Therm controllers (dev environment only; ships via HACS)"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component",
    "pyke2@git+https://github.com/ben-j-h/pyke2.git@v0.1.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
